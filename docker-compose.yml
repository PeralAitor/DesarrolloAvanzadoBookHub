services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=bookhub_jwt_secret_2024
    depends_on:
      - books-service
      - reviews-service
      - auth-service
    networks:
      - bookhub-network

  auth-service:
    build: ./microservice-auth
    ports:
      - "3003:3003"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bookhub
      - JWT_SECRET=mi_secreto_compartido
    depends_on:
      - mongodb
    networks:
      - bookhub-network

  reviews-service:
    build: ./microservice-reviews
    ports:
      - "3002:3002"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/bookhub
      - JWT_SECRET=mi_secreto_compartido
    depends_on:
      - mongodb
    networks:
      - bookhub-network

  books-service:
    build: ./microservice-books
    ports:
      - "3001:3001"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=bookhub_user
      - MYSQL_PASSWORD=bookhub_password
      - MYSQL_DB=bookhub
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bookhub-network

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - bookhub-network

  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - bookhub-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=bookhub
      - MYSQL_USER=bookhub_user
      - MYSQL_PASSWORD=bookhub_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./microservice-books/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bookhub_user", "-pbookhub_password"]
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - bookhub-network

  mongodb:
    image: mongo:6.0
    environment:
      - MONGO_INITDB_DATABASE=bookhub
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - bookhub-network

volumes:
  mysql_data:
  mongodb_data:

networks:
  bookhub-network:
    driver: bridge